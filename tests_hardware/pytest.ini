[pytest]
# Hardware suite: these tests require a physical ESP32 and/or a reachable
# broker. They are NOT part of the software suite and must never be used to
# claim software coverage.
testpaths = .
asyncio_mode = auto

# BLOCKED is a first-class outcome: a test that cannot run because hardware or
# credentials are missing is reported as blocked, never silently skipped and
# never as a pass.
addopts = -ra --strict-markers

markers =
    boot: ESP32 boot / Wi-Fi / MQTT bring-up (step 12)
    telemetry: MQTT topic and payload contract (step 12)
    lock: physical lock state changes (step 13)
    command: HA -> ESP32 authenticated command path (step 14)
    homekey: physical HomeKey/NFC authentication (steps 15-16)
    reboot: ESP32 reboot and power-interruption resilience (step 17)
    independence: MQTT/HA/internet independence of local HomeKey (step 18)
    security: secret-exposure scan on serial logs (step 9)
    failure: failure injection against the real device (step 10)

filterwarnings =
    error::DeprecationWarning
