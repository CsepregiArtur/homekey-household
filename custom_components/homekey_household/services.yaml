create_backup:
  name: Create a node backup
  description: >-
    Ask the node for an encrypted backup and keep it in Home Assistant. The node keeps no
    copy of its own - only the time and hash of the last one - so this is what makes a
    backup exist somewhere that survives the node. It runs on a schedule as well; this
    calls it now.
  fields:
    config_entry_id:
      name: Node
      description: >-
        Which node to back up, when several are reachable. Leave empty to back up every
        node whose address, certificate fingerprint and Web UI credentials are configured.
    include_credentials:
      name: Include the node's keys
      description: >-
        Also seal this node's credential store and its HomeKit pairing state into the
        backup. That is what lets a replacement node come back without every tag being
        enrolled again, and it is also what makes the file the keys to the door: keep it
        where a key would be kept. Off unless asked for, and off by default for the
        schedule too unless the entry is configured to include them. The node reports back
        what a copy actually holds, which is recorded with it.
      required: false
      selector:
        config_entry:
          integration: homekey_household

restore_backup:
  name: Restore a node from a backup
  description: >-
    Hand a backup to a node so it can restore itself. The backup is encrypted with a key
    derived from the household recovery secret, so the secret is required: it both proves
    the right to rejoin the household and decrypts the backup. Without a backup to pass,
    the newest stored copy for the household is used.
  fields:
    config_entry_id:
      name: Node
      description: Which node to restore.
      required: false
      selector:
        config_entry:
          integration: homekey_household
    recovery_secret:
      name: Recovery secret
      description: >-
        The household recovery secret, exactly as the node exported it. It is sent to the
        node and not stored.
      required: true
      example: 9f2c...
      selector:
        text:
    backup:
      name: Backup
      description: >-
        The backup as hex, to restore from a specific copy. Leave empty to use the newest
        one held for this household.
      required: false
      selector:
        text:
          multiline: true

guest_teach:
  name: Teach a guest card
  description: >-
    Arm a card write on a node. The card must then be presented to that node's own
    reader within about a minute - the write happens on the device, where the reader
    is, not here - so this is the start of the action rather than the end of it. The
    outcome is visible on the node's Guest tags sensor. A guest tag is a locally
    verified credential, not a HomeKey credential: it unlocks the same way, but a card
    can be cloned by anyone who reads it.
  fields:
    config_entry_id:
      name: Node
      description: >-
        Which node's reader to teach on. Required when more than one HomeKey entry is
        configured, because a card is taught to one door's reader and guessing would
        be worse than refusing.
      required: false
      selector:
        config_entry:
          integration: homekey_household
    label:
      name: Guest name
      description: >-
        A name for the card, up to 15 characters, shown in the guest list (for example
        Cleaner). Left empty, the node records it as Guest.
      required: false
      example: Cleaner
      selector:
        text:
    valid_days:
      name: Valid for (days)
      description: >-
        How long the card should work, counted from now. Left empty, the node applies
        its configured default validity; if that is 0 too, the card never expires.
        Needs the node to know the wall clock, which it only does after syncing time.
      required: false
      example: 7
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: days
          mode: box

guest_revoke:
  name: Revoke a guest card
  description: >-
    Remove one guest tag from a node. The card itself is untouched and becomes an
    ordinary unknown card; revoking is how a lost card is handled, and it cannot be
    undone except by teaching the card again.
  fields:
    config_entry_id:
      name: Node
      description: >-
        Which node to revoke from. Required when more than one HomeKey entry is
        configured.
      required: false
      selector:
        config_entry:
          integration: homekey_household
    tag_id:
      name: Tag id
      description: >-
        The card's tag id, as reported in the Guest tags sensor's attributes (eight
        hex characters, for example A1B2C3D4).
      required: true
      example: A1B2C3D4
      selector:
        text:

guest_cancel:
  name: Cancel a guest card write
  description: >-
    Abandon a card write that is armed and waiting for a card, so it is not applied to
    the next card presentation. The node times the arm out on its own; this is for
    calling it off deliberately.
  fields:
    config_entry_id:
      name: Node
      description: >-
        Which node to cancel on. Required when more than one HomeKey entry is
        configured.
      required: false
      selector:
        config_entry:
          integration: homekey_household
