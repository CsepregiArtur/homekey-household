# Disposable, local-only Mosquitto configuration for REAL integration validation.
#
# This file is test tooling. It is NOT part of the Home Assistant integration.
#
# Security posture for this disposable test broker:
#   * loopback only (127.0.0.1) — never reachable from the network
#   * anonymous access is enabled because it is loopback-only + disposable
#   * no persistence to disk (in-memory only, so state cannot leak between runs)
#   * non-default port so it cannot collide with a real broker
#
# Run with:
#   mosquitto -c tools/integration/mosquitto.test.conf -v

listener 18830 127.0.0.1

# Anonymous access: acceptable ONLY because the listener is loopback-bound and
# this broker exists solely for local validation. A production broker must use
# authentication + TLS (the firmware supports per-device credentials/ACLs).
allow_anonymous true

# No $SYS chatter: keeps the validation logs focused and secret-free.
sys_interval 0

# No on-disk persistence. Retained messages live in memory for the lifetime of
# the process, which is exactly what the disposable test stack wants.
persistence false

# Explicitly do NOT write a log file; stdout is captured by the harness.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
